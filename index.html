<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weftgrid</title>
<style>
  :root { --bg: #FAF8F5; --text: #231D1A; --muted: #6B5F58; --accent: #B3362B; }
  @media (prefers-color-scheme: dark) { :root { --bg: #231D1A; --text: #F3EDE7; --muted: #B9ACA3; --accent: #F07A6A; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 2.4rem; margin: 0; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Weftgrid</h1>
  <p>Logic puzzles, woven quietly. Picture logic (nonogram) puzzles with no ads, no accounts and no tracking.</p>
  <p><a href="privacy/">Privacy policy</a> · <a href="mailto:weftgrid.app@gmail.com">weftgrid.app@gmail.com</a></p>
</main>
</body>
</html>
